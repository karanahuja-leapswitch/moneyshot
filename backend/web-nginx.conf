# nginx for the MoneyShot web tier (isolated stack).
# Serves the chat SPA under /moneyshot/ and proxies /moneyshot/api/ to the bff
# (auth + SSE bridge). The public edge nginx forwards all of /moneyshot/ here.
server {
    listen 80;
    server_name _;

    # API: auth-verifying SSE bridge to the Hermes agent. Must come before the
    # SPA location so /moneyshot/api/... is not swallowed by try_files.
    # The trailing slash on both the location and proxy_pass strips /moneyshot/api/
    # so the bff sees /v1/chat/completions, /health, etc.
    location /moneyshot/api/ {
        proxy_pass http://bff:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (SSE): disable all buffering so chunks reach the browser live.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static SPA (built with base=/moneyshot/), files under html/moneyshot/.
    location /moneyshot/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /moneyshot/index.html;
    }

    location = /moneyshot {
        return 301 /moneyshot/;
    }
}
