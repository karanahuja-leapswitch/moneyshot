name: moneyshot

# MoneyShot = a web chat UI (built separately) talking to a Hermes agent.
#
#   browser ──/moneyshot/──────────────► web (nginx): serves the SPA
#           └─/moneyshot/api/──────────► web → bff (auth + SSE bridge)
#                                              └─► hermes: OpenAI-compatible
#                                                  API server (terminal-capable
#                                                  agent — private network only)
#
# `web` sits on both networks: deploynet so the public edge nginx (deploy-web-1)
# can proxy /moneyshot/ to it, and msnet so it can reach the bff. `bff` and
# `hermes` live only on msnet and are never published to the host or the edge.
services:
  # Hermes agent gateway with the OpenAI-compatible API server enabled.
  # NOT exposed: reachable only by the bff over msnet. API_SERVER_KEY is the
  # internal shared secret between bff and hermes (browsers never see it).
  hermes:
    image: hermes-agent:latest
    restart: unless-stopped
    env_file:
      - ./hermes/hermes.env
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
    volumes:
      # Persistent agent home: config.yaml (provider/model), memory, skills.
      - ./hermes/data:/opt/data
      # Shared with bff: the whatsapp-web skill writes QR PNGs here so the bff can
      # serve them to the browser at a short URL (the model won't echo a data-URI).
      - waqr:/waqr
    command: ["gateway", "run"]
    expose:
      - "8642"
    # hbnet lets Hermes reach the read-only HostBill MCP (hostbill-gateway-ultron-1:8080)
    # for tools like get_clients / get_tickets, configured in hermes/data/config.yaml.
    networks: [msnet, hbnet]

  # Auth + SSE bridge: verifies the Google ID token, injects the Hermes key.
  bff:
    build: ./bff
    image: moneyshot-bff:latest
    restart: unless-stopped
    env_file:
      - ./bff/bff.env
    depends_on:
      - hermes
    expose:
      - "8000"
    volumes:
      # Read-only: serve WhatsApp QR PNGs written by the hermes skill.
      - waqr:/waqr:ro
    networks: [msnet]

  # Web tier: serves the SPA under /moneyshot/ and proxies /moneyshot/api/ to
  # the bff. The SPA build (web/) is produced by the separate web-UI project.
  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html/moneyshot:ro
      - ./web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bff
    restart: unless-stopped
    networks: [msnet, deploynet]

networks:
  # Private network: bff ⇄ hermes ⇄ web. Not reachable from outside.
  msnet:
  # The public edge nginx (deploy-web-1) lives here; joining it lets the edge
  # proxy /moneyshot/ to the web container by name.
  deploynet:
    external: true
    name: deploy_default
  # HostBill gateway's private network — hermes joins it (read-only) to reach the
  # ultron HostBill MCP by container name. Owned by the hostbill-gateway stack.
  hbnet:
    external: true
    name: hostbill-gateway_hbnet

volumes:
  # Small shared scratch for WhatsApp QR PNGs (hermes writes, bff serves).
  waqr:
