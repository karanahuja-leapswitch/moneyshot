<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Invoice Reminder Message — PRD</title>
		<style>
			* { box-sizing: border-box; }
			html, body { height: 100%; margin: 0; }
			body {
				background: #0d1117;
				color: #e6edf3;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				display: flex;
				flex-direction: column;
				min-height: 100vh;
			}
			.stage {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				min-height: 0;
			}
			.slide {
				max-width: 100%;
				max-height: calc(100vh - 120px);
				object-fit: contain;
				border-radius: 10px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
				user-select: none;
			}
			.controls {
				flex-shrink: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 18px;
				padding: 16px;
			}
			button.nav {
				appearance: none;
				border: 1px solid rgba(255, 255, 255, 0.18);
				background: rgba(255, 255, 255, 0.08);
				color: #fff;
				font-size: 20px;
				line-height: 1;
				width: 46px;
				height: 46px;
				border-radius: 999px;
				cursor: pointer;
				transition: background 0.15s ease;
			}
			button.nav:hover { background: rgba(255, 255, 255, 0.18); }
			.counter { font-variant-numeric: tabular-nums; font-size: 14px; color: #9aa4b2; min-width: 54px; text-align: center; }
			.dots { display: flex; gap: 9px; }
			.dot {
				width: 10px; height: 10px; border-radius: 999px;
				background: rgba(255, 255, 255, 0.28);
				border: none; padding: 0; cursor: pointer;
			}
			.dot.active { background: #f5a623; }
		</style>
	</head>
	<body>
		<div class="stage">
			<img id="slide" class="slide" alt="Slide" />
		</div>
		<div class="controls">
			<button class="nav" id="prev" title="Previous (←)" aria-label="Previous">‹</button>
			<span class="counter" id="counter"></span>
			<div class="dots" id="dots"></div>
			<button class="nav" id="next" title="Next (→)" aria-label="Next">›</button>
		</div>

		<script>
			(function () {
				// Relative paths so the page works at any mount point
				// (/moneyshot/invoice-reminder-message-prd/ and the top-level
				// /invoice-reminder-message-prd/). Requires a trailing slash.
				var SLIDES = [1, 2, 3, 4, 5].map(function (n) { return "slide" + n + ".png"; });
				var i = 0;
				var img = document.getElementById("slide");
				var counter = document.getElementById("counter");
				var dotsWrap = document.getElementById("dots");

				// Build dots
				SLIDES.forEach(function (_, idx) {
					var d = document.createElement("button");
					d.className = "dot";
					d.setAttribute("aria-label", "Go to slide " + (idx + 1));
					d.addEventListener("click", function () { go(idx); });
					dotsWrap.appendChild(d);
				});
				var dots = Array.prototype.slice.call(dotsWrap.children);

				function render() {
					img.src = SLIDES[i];
					img.alt = "Slide " + (i + 1);
					counter.textContent = i + 1 + " / " + SLIDES.length;
					dots.forEach(function (d, idx) { d.classList.toggle("active", idx === i); });
				}
				function go(n) { i = (n + SLIDES.length) % SLIDES.length; render(); }
				function next() { go(i + 1); }
				function prev() { go(i - 1); }

				document.getElementById("next").addEventListener("click", next);
				document.getElementById("prev").addEventListener("click", prev);
				document.addEventListener("keydown", function (e) {
					if (e.key === "ArrowRight") next();
					else if (e.key === "ArrowLeft") prev();
				});
				// Preload the rest for snappy nav.
				SLIDES.forEach(function (s) { var p = new Image(); p.src = s; });

				render();
			})();
		</script>
	</body>
</html>
